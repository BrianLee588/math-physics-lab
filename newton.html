<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>牛頓第二運動定律 | 力如何改變物體的運動？</title>
    <!-- 引入 Tailwind CSS 讓排版漂亮 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Chart.js 來畫即時的位置與速度圖表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <!-- 標題 -->
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">牛頓第二運動定律 | 力如何改變物體的運動？</h1>
        <p class="text-center text-gray-600 text-sm mb-4">水平面上的方塊（本模型忽略摩擦力）</p>

        <!-- 模擬畫布 (Canvas 取代 Matplotlib 視窗) -->
        <div class="border border-gray-300 rounded-lg p-4 bg-white mb-6">
            <div id="status-bar" class="text-sm font-semibold text-gray-700 mb-2 bg-gray-50 p-2 rounded border">
                m = <span id="val-m">10.5</span> kg | ΣF = <span id="val-f">40.0</span> N | a = <span id="val-a">3.81</span> m/s² | t = <span id="val-t">0.00</span> s | v = <span id="val-v">0.00</span> m/s | x = <span id="val-x">0.00</span> m
            </div>
            <!-- 動畫繪製區域 -->
            <canvas id="simCanvas" width="750" height="180" class="w-full bg-slate-50 border border-gray-200 rounded"></canvas>
            <div class="text-right text-xs text-gray-500 mt-1">紅：合力 ｜ 綠：加速度 ｜ 藍：速度</div>
        </div>

        <!-- 圖表區域 (位置-時間圖 & 速度-時間圖) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-3 border rounded-lg">
                <h3 class="text-sm font-bold text-gray-700 text-center mb-1">位置 - 時間圖</h3>
                <canvas id="posChart" height="120"></canvas>
            </div>
            <div class="bg-white p-3 border rounded-lg">
                <h3 class="text-sm font-bold text-gray-700 text-center mb-1">速度 - 時間圖</h3>
                <canvas id="velChart" height="120"></canvas>
            </div>
        </div>

        <!-- 互動控制拉桿與按鈕 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-gray-50 p-4 rounded-lg border">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">質量 m (kg): <span id="slider-m-val" class="font-bold">10.5</span></label>
                <input type="range" id="slider-m" min="1" max="50" step="0.5" value="10.5" class="w-full cursor-pointer">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">水平外力 F (N): <span id="slider-f-val" class="font-bold">40</span></label>
                <input type="range" id="slider-f" min="-100" max="100" step="1" value="40" class="w-full cursor-pointer">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">初速度 v₀ (m/s): <span id="slider-v0-val" class="font-bold">0</span></label>
                <input type="range" id="slider-v0" min="-20" max="20" step="1" value="0" class="w-full cursor-pointer">
            </div>
        </div>

        <!-- 控制按鈕 -->
        <div class="flex justify-center gap-4">
            <button id="btn-play" class="px-5 py-2 bg-blue-600 text-white font-medium rounded-lg shadow hover:bg-blue-700 transition">播放</button>
            <button id="btn-pause" class="px-5 py-2 bg-amber-500 text-white font-medium rounded-lg shadow hover:bg-amber-600 transition">暫停</button>
            <button id="btn-reset" class="px-5 py-2 bg-gray-600 text-white font-medium rounded-lg shadow hover:bg-gray-700 transition">重置</button>
        </div>
    </div>

    <!-- 模擬核心邏輯 JavaScript -->
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // 參數變數
        let m = 10.5, F = 40.0, v0 = 0.0;
        let t = 0.0, x = 0.0, v = 0.0, a = 0.0;
        let isPlaying = false;
        let animInterval = null;

        let timeData = [], posData = [], velData = [];

        // 初始化 Chart.js 圖表
        const posChartCtx = document.getElementById('posChart').getContext('2d');
        const posChart = new Chart(posChartCtx, {
            type: 'line',
            data: { labels: timeData, datasets: [{ label: '位置 x', data: posData, borderColor: 'blue', borderWidth: 2, pointRadius: 0 }] },
            options: { responsive: true, scales: { x: { title: { display: true, text: '時間 (秒)' } }, y: { title: { display: true, text: '位置 (m)' } } } }
        });

        const velChartCtx = document.getElementById('velChart').getContext('2d');
        const velChart = new Chart(velChartCtx, {
            type: 'line',
            data: { labels: timeData, datasets: [{ label: '速度 v', data: velData, borderColor: 'orange', borderWidth: 2, pointRadius: 0 }] },
            options: { responsive: true, scales: { x: { title: { display: true, text: '時間 (秒)' } }, y: { title: { display: true, text: '速度 (m/s)' } } } }
        });

        function updatePhysicsParams() {
            m = parseFloat(document.getElementById('slider-m').value);
            F = parseFloat(document.getElementById('slider-f').value);
            v0 = parseFloat(document.getElementById('slider-v0').value);

            document.getElementById('slider-m-val').innerText = m;
            document.getElementById('slider-f-val').innerText = F;
            document.getElementById('slider-v0-val').innerText = v0;

            a = F / m;
            if (!isPlaying) {
                v = v0;
                draw();
            }
        }

        function resetSimulation() {
            isPlaying = false;
            t = 0.0;
            x = 0.0;
            v = v0;
            a = F / m;
            timeData.length = 0;
            posData.length = 0;
            velData.length = 0;
            posChart.update();
            velChart.update();
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 畫地面 (Y = 140)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 140);
            ctx.lineTo(canvas.width, 140);
            ctx.stroke();

            // 計算方塊在畫布上的像素位置 (底部貼在 140，高 40，所以頂部在 100)
            let boxX = 100 + x * 30; // 放大比例
            let boxTopY = 100;

            // 畫方塊
            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(boxX - 20, boxTopY, 40, 40);
            ctx.strokeStyle = '#1e3a8a';
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX - 20, boxTopY, 40, 40);

            // 標示 m
            ctx.fillStyle = '#000';
            ctx.font = '14px sans-serif';
            ctx.fillText('m', boxX - 6, boxTopY + 25);

            // 讓所有箭頭整齊排在方塊「正上方」，由下到上依序為：藍色速度、紅色合力、綠色加速度
            if (v !== 0) {
                drawArrow(boxX, boxTopY - 12, boxX + v * 10, boxTopY - 12, 'blue', `v = ${v.toFixed(2)} m/s`);
            }
            if (F !== 0) {
                drawArrow(boxX, boxTopY - 28, boxX + F * 1.2, boxTopY - 28, 'red', `合力 F = ${F.toFixed(1)} N`);
            }
            if (a !== 0) {
                drawArrow(boxX, boxTopY - 44, boxX + a * 12, boxTopY - 44, 'green', `a = ${a.toFixed(2)} m/s²`);
            }

            // 更新上方狀態文字
            document.getElementById('val-m').innerText = m;
            document.getElementById('val-f').innerText = F;
            document.getElementById('val-a').innerText = a.toFixed(2);
            document.getElementById('val-t').innerText = t.toFixed(2);
            document.getElementById('val-v').innerText = v.toFixed(2);
            document.getElementById('val-x').innerText = x.toFixed(2);
        }

        function drawArrow(fromX, fromY, toX, toY, color, label) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();
            
            // 畫箭頭頭部
            const headLength = 8;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(toX, toY);
            ctx.fill();

            // 文字標籤
            ctx.font = '11px sans-serif';
            ctx.fillText(label, fromX + 5, fromY - 4);
        }

        function step() {
            if (!isPlaying) return;
            const dt = 0.05; // 時間步長
            t += dt;
            v = v0 + a * t;
            x = v0 * t + 0.5 * a * t * t;

            // 記錄數據到圖表 (限制長度避免過長)
            if (timeData.length > 100) {
                timeData.shift();
                posData.shift();
                velData.shift();
            }
            timeData.push(t.toFixed(2));
            posData.push(x);
            velData.push(v);

            posChart.update('none');
            velChart.update('none');

            draw();

            if (t > 15) { // 超過15秒自動暫停
                isPlaying = false;
            }
        }

        // 事件監聽
        document.getElementById('slider-m').addEventListener('input', updatePhysicsParams);
        document.getElementById('slider-f').addEventListener('input', updatePhysicsParams);
        document.getElementById('slider-v0').addEventListener('input', updatePhysicsParams);

        document.getElementById('btn-play').addEventListener('click', () => { isPlaying = true; });
        document.getElementById('btn-pause').addEventListener('click', () => { isPlaying = false; });
        document.getElementById('btn-reset').addEventListener('click', resetSimulation);

        // 初始化
        updatePhysicsParams();
        setInterval(step, 10); // 每 50ms 更新一次畫面
    </script>
</body>
</html>
